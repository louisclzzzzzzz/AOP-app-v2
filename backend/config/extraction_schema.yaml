# Schéma des données à extraire — étape 3 (§6.2 du PLAN, source : refs/donnes_ref_v2.md, Feuil2).
#
# La Feuil2 v2 est une liste à plat d'une cinquantaine de données. Elle est regroupée ici en
# SECTIONS thématiques (bloc `sections` ci-dessous) : c'est le seul ordre de lecture praticable à
# ce volume, aussi bien dans l'écran de validation que dans le rapport et l'export Excel.
#
# Trois lignes de la Feuil2 ne sont PAS des champs d'extraction et n'apparaissent donc pas ici :
#   - « Nature et fonction principale de l'ouvrage » (10 lignes), « Objectifs spécifiques »
#     (10 à 15 lignes) et « Description de l'opération » (10 à 15 lignes) sont des rédactions
#     longues, incompatibles avec la règle « valeur normalisée et concise, jamais une phrase
#     entière » du moteur d'extraction. Elles sont traitées en Phase 1 (synthèse projet), qui relit
#     intégralement les documents pivots : voir les thèmes `nature_fonction_ouvrage`,
#     `objectifs_specifiques` et `description_operation` de `synthese_projet_schema.yaml`.
#   - « Présence d'un risque » (inondation, séisme, RGA, radon, cavités…) provient de l'API
#     Géorisques et non des documents du dossier : elle reste couverte par la Phase 2 (audit des
#     risques, `app/audit/georisques.py`), qui l'interroge déjà à partir de l'adresse du chantier.
#
# Chaque champ :
#   id                   : identifiant stable (les 5 utilisés dans models.yaml/extraction/
#                           cross_check_required_fields doivent exister ici tels quels). Les ids
#                           de la v1 sont conservés tels quels même quand le libellé v2 a changé —
#                           les renommer orphelinerait les `ExtractionResult` déjà en base.
#   libelle               : nom métier du champ (colonne « Donnée » de la Feuil2)
#   section               : id d'une entrée du bloc `sections` ci-dessous
#   resultat_attendu      : colonne « Résultat attendu » de la Feuil2 — indication du format/des
#                           valeurs attendues, transmise telle quelle au LLM
#   reference_categories  : chemins de app/classify/taxonomy.yaml, par ordre de priorité —
#                           le moteur cherche d'abord dans ces catégories (colonne « Fichier de
#                           référence » de la Feuil2)
#   indices               : mots-clés (regex) pour la recherche intra-document élargie,
#                           utilisée seulement si aucun document de référence ne matche

sections:
  - id: identification
    libelle: "Identification de l'opération"
  - id: garanties
    libelle: "Garanties demandées"
  - id: ouvrage
    libelle: "Ouvrage, destination et volumétrie"
  - id: economie
    libelle: "Économie du projet"
  - id: calendrier
    libelle: "Calendrier"
  - id: intervenants
    libelle: "Intervenants et missions de contrôle"
  - id: site_avoisinants
    libelle: "Site et avoisinants"
  - id: sol_soussol
    libelle: "Sol, sous-sol et eaux"
  - id: construction
    libelle: "Constructif et procédés particuliers"
  - id: equipements
    libelle: "Équipements et machines"
  - id: cas_particuliers
    libelle: "Cas particuliers"

fields:
  # --- Identification de l'opération ------------------------------------------------------------
  - id: nom_moa
    libelle: "Nom du MOA"
    section: identification
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP", "TECH/ARRETE PC"]
    indices: ["maître d'ouvrage", "MOA"]

  - id: adresse_moa
    libelle: "Adresse du MOA"
    section: identification
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP", "TECH/ARRETE PC"]
    indices: ["maître d'ouvrage", "siège social", "adresse"]

  - id: nom_chantier
    libelle: "Nom du chantier"
    section: identification
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["opération", "chantier"]

  - id: adresse_chantier
    libelle: "Adresse du chantier"
    section: identification
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["adresse du chantier", "lieu des travaux", "situation de l'opération"]

  # Feuil2 : « Déduit des adresses ». Le champ est donc renseigné à partir de l'adresse du chantier
  # quand elle figure dans le document analysé — d'où les mêmes catégories de référence.
  - id: localisation
    libelle: "Localisation"
    section: identification
    resultat_attendu: "Métropole, Corse, ou DROM COM (dire quel département ou territoire)"
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP", "TECH/ARRETE PC"]
    indices:
      - "Corse"
      - "Guadeloupe"
      - "Martinique"
      - "Guyane"
      - "La Réunion"
      - "Mayotte"
      - "Saint-Martin"
      - "Saint-Barthélemy"
      - "Polynésie"
      - "Nouvelle-Calédonie"
      - "DROM"
      - "métropol"

  # --- Garanties demandées ----------------------------------------------------------------------
  - id: garanties_demandees
    libelle: "Garanties demandées"
    section: garanties
    resultat_attendu: "TRC = tous risques chantier, DO = dommage ouvrage, CNR = constructeur non réalisateur, CCRD = contrat commun de responsabilité décennale, RCMOA/RCMO = responsabilité civile du maître d'ouvrage, TRM = tous risques montage"
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices:
      - "tous risques chantier"
      - "\\bTRC\\b"
      - "dommage[s]? ouvrage"
      - "\\bDO\\b"
      - "constructeur non réalisateur"
      - "\\bCNR\\b"
      - "responsabilité décennale"
      - "\\bCCRD\\b"
      - "responsabilité civile du maître d'ouvrage"
      - "\\bRCMOA?\\b"
      - "tous risques montage"
      - "\\bTRM\\b"

  # Feuil2 : « Faire un tableau de correspondance Garantie/montants ». Une seule valeur de champ,
  # mais structurée (une paire garantie → montant par ligne) : c'est la seule donnée de la Feuil2
  # dont le résultat attendu est explicitement tabulaire.
  - id: montants_garanties_demandes
    libelle: "Montants des garanties demandés"
    section: garanties
    resultat_attendu: "Tableau de correspondance garantie → montant, une paire par ligne (ex. « TRC : 12 000 000 € ; DO : 8 500 000 € »). Reprendre le libellé de garantie tel qu'écrit dans le document."
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices:
      - "montant.{0,15}garantie"
      - "plafond de garantie"
      - "limite contractuelle d'indemnité"
      - "\\bLCI\\b"
      - "capitaux garantis"
      - "franchise"

  # --- Ouvrage, destination et volumétrie -------------------------------------------------------
  - id: travaux_neufs_ou_existant
    libelle: "Travaux neufs, travaux sur existant"
    section: ouvrage
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["travaux neufs", "travaux sur existant", "rénovation", "réhabilitation"]

  # La taxonomie de destinations de la v2 est bien plus fine que celle de la v1 (qui s'arrêtait à
  # « Tertiaire »/« bâtiment agricole ») : elle distingue notamment les sous-types à enjeu de
  # souscription (entrepôt/atelier agroalimentaire ou frigorifique, bâtiment industriel à risque
  # explosif, résidence de tourisme). Elle est reprise intégralement pour que le LLM choisisse dans
  # la liste métier au lieu d'inventer sa propre formulation.
  - id: destination_batiment
    libelle: "Destination du bâtiment"
    section: ouvrage
    resultat_attendu: >-
      Choisir dans : bâtiment collectif d'habitation ; maison individuelle en secteur groupé (un
      permis de construire pour l'ensemble) ; hôtel ; bureaux ; école, collège, lycée, université ;
      hôpital, clinique ; maison de retraite médicalisée, maison de retraite ; centre
      psychiatrique ; cabinet médical, maison médicale ; clinique vétérinaire ; salle polyvalente ;
      ateliers municipaux ; centre d'incendie et de secours, caserne de pompiers ; caserne de
      gendarmerie ; centre culturel et de loisirs ; centre médical éducatif ; centre paroissial ;
      centre culturel ; crèche ; établissement sportif ; commerce ; entrepôt (préciser
      agroalimentaire ou frigorifique) ; atelier (préciser agroalimentaire ou frigorifique) ;
      bâtiment industriel (préciser les risques, ex. explosifs) ; base logistique (préciser
      agroalimentaire ou frigorifique) ; bâtiment agricole, de stockage agricole ou d'élevage ;
      résidence de vacances et de tourisme (résidence hôtelière, village de vacances, résidence
      appartements-hôtels) ; thalassothérapie ; centre aquatique ; autre (préciser).
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["destination", "usage du bâtiment"]

  - id: nombre_batiments_neufs
    libelle: "Nombre de bâtiments neufs"
    section: ouvrage
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["bâtiment[s]? neuf[s]?"]

  - id: nombre_batiments_existants
    libelle: "Nombre de bâtiments existants"
    section: ouvrage
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["bâtiment[s]? existant[s]?"]

  - id: nombre_niveaux_par_batiment
    libelle: "Nombre de niveaux par bâtiment"
    section: ouvrage
    resultat_attendu: >-
      Le compte total de niveaux, bâtiment par bâtiment, tel qu'explicitement indiqué dans le
      document (ex. « Nombre de niveaux : 12 »). Ne jamais déduire un total d'une plage de niveaux
      nommés : « du niveau -8 au niveau +3 » désigne 12 niveaux, pas 8.
    reference_categories: ["TECH/ARRETE PC", "ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["nombre de niveaux", "niveau[x]?", "R\\+\\d", "sous-sol"]

  - id: hauteur_totale_batiment
    libelle: "Hauteur totale du bâtiment"
    section: ouvrage
    resultat_attendu: "En mètres. Préciser le bâtiment si plusieurs hauteurs sont données."
    reference_categories: ["TECH/ARRETE PC", "TECH/NOTICE", "TECH/CCTP TRAVAUX", "TECH/PLANS"]
    indices: ["hauteur totale", "hauteur du bâtiment", "hauteur au faîtage", "hauteur à l'acrotère", "\\bIGH\\b"]

  - id: surfaces_au_sol
    libelle: "Surfaces au sol de chaque bâtiment"
    section: ouvrage
    resultat_attendu: "Une surface par bâtiment, avec son unité (m²) et le nom du bâtiment."
    reference_categories: ["TECH/ARRETE PC", "TECH/NOTICE", "ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["surface au sol", "emprise au sol", "surface de plancher", "\\bSHON\\b", "\\bSDP\\b"]

  # --- Économie du projet -----------------------------------------------------------------------
  - id: montants_totaux_ht
    libelle: "Montants totaux HT"
    section: economie
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["montant.{0,20}HT", "hors taxes"]

  - id: montants_totaux_ttc
    libelle: "Montants totaux TTC"
    section: economie
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["montant.{0,20}TTC", "toutes taxes comprises"]

  - id: montants_honoraires
    libelle: "Montants des honoraires"
    section: economie
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["honoraires"]

  - id: montants_existants
    libelle: "Montants des existants"
    section: economie
    resultat_attendu: "Si travaux sur existants"
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["valeur des existants", "montant des existants"]

  # --- Calendrier -------------------------------------------------------------------------------
  - id: date_debut_travaux
    libelle: "Date de début des travaux"
    section: calendrier
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["début des travaux", "démarrage des travaux"]

  - id: date_fin_previsionnelle
    libelle: "Date prévisionnelle de fin"
    section: calendrier
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["fin prévisionnelle", "durée des travaux", "délai d'exécution"]

  - id: reception_echelonnee
    libelle: "Réception échelonnée"
    section: calendrier
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["réception échelonnée", "réceptions partielles"]

  # Feuil2 : « Déduire le nombre de mois de chantier ». Seul champ de la Feuil2 explicitement
  # calculé plutôt que relevé — la durée est souvent donnée telle quelle (« délai d'exécution :
  # 30 mois »), sinon elle se déduit des deux dates ci-dessus. C'est une condition directe du
  # tableau des conventions (Feuil1) : < 24 mois, entre 24 et 48 mois, > 48 mois.
  - id: duree_chantier_mois
    libelle: "Nombre de mois de chantier"
    section: calendrier
    resultat_attendu: >-
      Durée en mois. La reprendre telle quelle si le document la donne (délai d'exécution), sinon
      la déduire des dates de début et de fin prévisionnelle en indiquant ce calcul dans la
      justification. Préciser si la durée inclut une période de préparation.
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP", "TECH/PLANNING"]
    indices: ["durée du chantier", "durée des travaux", "durée d'exécution", "délai d'exécution", "délai global", "\\d+ mois"]

  # --- Intervenants et missions de contrôle -----------------------------------------------------
  - id: equipe_moe
    libelle: "Équipe de MOE"
    section: intervenants
    resultat_attendu: "Nom et adresse : architecte, bureau d'étude structure, sol, bureau de contrôle, fluides/CVC, toutes spécialités, …"
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["maîtrise d'œuvre", "architecte", "bureau d'étude", "BET"]

  - id: existence_controle_technique
    libelle: "Existence mission de contrôle technique"
    section: intervenants
    resultat_attendu: "Oui/non"
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["contrôle technique", "bureau de contrôle"]

  - id: existence_rict
    libelle: "Existence RICT"
    section: intervenants
    resultat_attendu: "Oui/non"
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["RICT", "rapport initial de contrôle technique"]

  - id: missions_bureau_controle
    libelle: "Missions du bureau de contrôle"
    section: intervenants
    resultat_attendu: "Liste des missions (L, LE, PS, SH, SEI, PHhab, TH, HAND, …)"
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["mission[s]? L", "mission[s]? PS", "mission[s]? du bureau de contrôle"]

  - id: existence_bureau_etude_sol
    libelle: "Existence bureau d'étude de sol"
    section: intervenants
    resultat_attendu: "Oui/non"
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["bureau d'étude de sol", "étude géotechnique", "géotechnicien"]

  - id: existence_mission_g2pro
    libelle: "Existence mission G2PRO"
    section: intervenants
    resultat_attendu: "Oui/non"
    reference_categories: ["ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["G2 PRO", "G2PRO", "mission G2"]

  # --- Site et avoisinants ----------------------------------------------------------------------
  # Feuil2 : « Interpréter dans les documents si on est dans une zone urbaine, dense ou rurale ».
  # C'est une condition directe du tableau des conventions (Feuil1) : le niveau RCMO bascule sur
  # « zone urbaine dense ou travaux sur/sous ouvrages tiers ».
  - id: type_zone
    libelle: "Type de zone"
    section: site_avoisinants
    resultat_attendu: >-
      Zone urbaine dense, urbaine, ou rurale. S'appuyer sur la taxonomie des PLU quand elle est
      citée : zone U (urbaine, déjà urbanisée ou desservie par les réseaux), zone AU (à urbaniser),
      zones A et N (agricoles et naturelles, protégées). Indiquer le zonage PLU relevé s'il existe.
    reference_categories: ["TECH/ARRETE PC", "ASS/CCTP", "ASS/RC", "ASS/CCAP"]
    indices: ["zone urbaine", "zone U\\b", "zone AU\\b", "\\bPLU\\b", "plan local d'urbanisme", "milieu rural"]

  - id: mission_av
    libelle: "Mission AV"
    section: site_avoisinants
    resultat_attendu: "Si avoisinants"
    reference_categories: ["TECH/RICT", "ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["mission AV", "avoisinants"]

  - id: distance_avoisinants
    libelle: "Distance des avoisinants"
    section: site_avoisinants
    resultat_attendu: "Si avoisinants — distance en mètres, en précisant l'avoisinant concerné"
    reference_categories: ["TECH/RICT", "ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["avoisinant", "mitoyen", "distance"]

  - id: refere_preventif
    libelle: "Existence d'un référé préventif / constat d'huissier"
    section: site_avoisinants
    resultat_attendu: "Si avoisinants — Oui/non"
    reference_categories: ["TECH/RICT", "ASS/RC", "ASS/CCTP", "ASS/CCAP"]
    indices: ["référé préventif", "constat d'huissier", "commissaire de justice"]

  # --- Sol, sous-sol et eaux --------------------------------------------------------------------
  - id: etude_de_sol
    libelle: "Études de sol disponibles"
    section: sol_soussol
    resultat_attendu: "Rechercher G2 AVP, G2 PRO, G5 — lister les missions géotechniques effectivement disponibles"
    reference_categories: ["TECH/ETUDE DE SOL"]
    indices: ["G2 AVP", "G2 PRO", "\\bG5\\b", "étude géotechnique"]

  - id: niveaux_sous_sol
    libelle: "Niveaux de sous-sol"
    section: sol_soussol
    resultat_attendu: "Nombre de niveaux enterrés, par bâtiment si plusieurs"
    reference_categories: ["TECH/NOTICE", "TECH/PLANS", "TECH/CCTP TRAVAUX", "TECH/ARRETE PC"]
    indices: ["sous-sol", "niveau[x]? enterré[s]?", "\\bR-\\d", "infrastructure"]

  - id: profondeur_sous_sol
    libelle: "Profondeur du sous-sol"
    section: sol_soussol
    resultat_attendu: "Profondeur d'excavation en mètres (condition du niveau 1 TRC : moins de 2 niveaux de sous-sol ou 5 m)"
    reference_categories: ["TECH/NOTICE", "TECH/PLANS", "TECH/CCTP TRAVAUX", "TECH/ETUDE DE SOL"]
    indices: ["profondeur", "excavation", "terrassement", "fouille", "arase"]

  - id: emprise_sous_sol
    libelle: "Emprise du sous-sol"
    section: sol_soussol
    resultat_attendu: "Dire s'il y a création d'un sous-sol sous l'emprise d'un autre bâtiment (mitoyen) — Oui/non, avec le bâtiment concerné"
    reference_categories: ["TECH/NOTICE", "TECH/PLANS", "TECH/CCTP TRAVAUX"]
    indices: ["sous l'emprise", "sous le bâtiment existant", "reprise en sous-œuvre", "mitoyen"]

  - id: parties_enterrees
    libelle: "Parties enterrées"
    section: sol_soussol
    resultat_attendu: "Décrire la gestion de l'eau : cuvelage, étanchéité des parois, drainage, type de cuvelage retenu"
    reference_categories: ["TECH/NOTICE", "ASS/CCTP", "TECH/CCTP TRAVAUX", "TECH/PLANS"]
    indices: ["cuvelage", "étanchéité des parois", "drainage", "partie enterrée", "paroi moulée", "paroi berlinoise"]

  - id: niveau_hautes_eaux
    libelle: "Niveaux des plus hautes eaux"
    section: sol_soussol
    resultat_attendu: "Rechercher EE, EB, EH — description des niveaux recensés dans l'étude de sol, avec leurs cotes"
    reference_categories: ["TECH/ETUDE DE SOL"]
    indices: ["plus hautes eaux", "\\bEE\\b", "\\bEB\\b", "\\bEH\\b", "\\bPHEC\\b", "niveau piézométrique", "nappe"]

  - id: stratigraphie
    libelle: "Stratigraphie"
    section: sol_soussol
    resultat_attendu: "Couches du sous-sol, lithologie — une couche par ligne, avec sa profondeur"
    reference_categories: ["TECH/ETUDE DE SOL"]
    indices: ["stratigraphie", "lithologie", "couches du sous-sol", "coupe géologique"]

  - id: pollution_sols
    libelle: "Pollution des sols"
    section: sol_soussol
    resultat_attendu: "Décrire le niveau de pollution et le traitement prévu si les sols sont pollués — « Aucune pollution mentionnée » sinon"
    reference_categories: ["TECH/ETUDE DE SOL", "TECH/CCTP TRAVAUX"]
    indices: ["pollution", "sols pollués", "dépollution", "terres polluées", "\\bHAP\\b", "hydrocarbures", "amiante"]

  # --- Constructif et procédés particuliers -----------------------------------------------------
  # Les deux champs suivants correspondent aux deux lignes « Structure/charpente » de la Feuil2, et
  # portent les conditions du niveau 1 TRC (Feuil1) : portée < 12 m béton armé / charpente bois,
  # < 20 m structures métalliques ; absence d'ouvrage en bois.
  - id: structure_ossature
    libelle: "Structure / charpente — type d'ossature"
    section: construction
    resultat_attendu: "Type d'ossature : béton, bois, métal (ou combinaison, en précisant quelle partie d'ouvrage)"
    reference_categories: ["TECH/CCTP TRAVAUX", "TECH/NOTICE", "TECH/RICT"]
    indices: ["ossature", "charpente", "béton armé", "structure métallique", "structure bois"]

  - id: portee_max_appuis
    libelle: "Structure / charpente — portée maximale entre 2 appuis"
    section: construction
    resultat_attendu: "Portée maximale entre deux appuis, en mètres"
    reference_categories: ["TECH/CCTP TRAVAUX", "TECH/PLANS", "TECH/NOTICE"]
    indices: ["portée", "entre appuis", "entre axes", "travée"]

  - id: presence_reemploi
    libelle: "Présence de réemploi"
    section: construction
    resultat_attendu: "Oui/non — si oui, lister les matériaux de réemploi trouvés dans les CCTP"
    reference_categories: ["TECH/CCTP TRAVAUX", "TECH/NOTICE"]
    indices: ["réemploi", "réutilisation", "matériaux de récupération", "économie circulaire"]

  - id: presence_photovoltaique
    libelle: "Présence de photovoltaïque"
    section: construction
    resultat_attendu: "Oui/non — si oui, lister les procédés et dire s'ils sont de technique courante ou de technique non courante (TNC)"
    reference_categories: ["TECH/CCTP TRAVAUX", "TECH/NOTICE"]
    indices: ["photovoltaïque", "panneaux solaires", "\\bPV\\b", "centrale solaire", "\\bTNC\\b"]

  - id: ouvrage_bois
    libelle: "Ouvrage en bois"
    section: construction
    resultat_attendu: "Décrire les éléments d'ouvrage en bois (structure, charpente, façade, plancher) — « Aucun » si absent"
    reference_categories: ["TECH/CCTP TRAVAUX", "TECH/NOTICE"]
    indices: ["bois lamellé", "\\bCLT\\b", "ossature bois", "charpente bois", "structure bois", "bois massif"]

  # --- Équipements et machines ------------------------------------------------------------------
  # Périmètre de la Feuil2 : les machines et équipements destinés à une UTILISATION
  # PROFESSIONNELLE de l'ouvrage (machines d'usine, baies IT en datacenter) — pas les équipements
  # techniques du bâtiment (CVC, ascenseurs). C'est le déclencheur d'une garantie TRM.
  - id: equipements_machines
    libelle: "Équipements et machines"
    section: equipements
    resultat_attendu: >-
      Décrire les machines et équipements destinés à une utilisation professionnelle de l'ouvrage
      (ex. machines dans des usines, baies IT dans des datacenters). Ne pas lister les équipements
