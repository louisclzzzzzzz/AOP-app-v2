# Schéma de la synthèse projet — Phase 1 du protocole d'analyse
# (refs/PHASE ANALYSE/00_PROTOCOLE.md, section "INSTRUCTIONS POUR LA PHASE 1 - SYNTHÈSE PROJET").
#
# Contrairement à `extraction_schema.yaml` (champs atomiques, une valeur courte par champ), ce
# fichier modélise le rapport en THÈMES : chacun correspond à un point de la "LISTE DÉTAILLÉE DES
# POINTS À DÉVELOPPER" du protocole, avec son propre format de sortie et ses documents pivots
# prioritaires (app/synthesis/).
#
# --- Doctrine de forme : le tableau est le défaut, la prose est l'exception -------------------
#
# La Phase 1 produisait des rapports de 70 à 100 k caractères : des essais avec introduction,
# récapitulatif final, gras décoratif et re-formulation du même fait à trois endroits. Une donnée
# factuelle et énumérable (un montant, un nombre de niveaux, un avis, une couche de sol, une
# mission de contrôle) se lit mieux, se vérifie plus vite et se compare entre documents dans un
# TABLEAU. La prose n'est conservée que là où l'argumentation porte réellement l'information :
# la description de l'opération, les objectifs, le diagnostic de l'existant.
#
# Trois leviers, tous appliqués ici :
#   1. `format: tableau` sur tout thème énumérable, avec les COLONNES imposées dans `instructions`
#      (sans colonnes imposées, le LLM retombe en prose sous un titre de tableau) ;
#   2. `max_lignes` : plafond dur de lignes rendues, injecté dans le prompt (app/synthesis/engine.py) ;
#   3. le prompt système du "reduce" interdit introduction, conclusion, récapitulatif et gras
#      décoratif — voir `_TOPIC_SYSTEM_PROMPT`.
#
# Rien de tout cela ne touche l'étape "map" : le relevé par document doit rester exhaustif (c'est
# ce que corrige le calibrage de volume du map), la mise en forme se décide au "reduce" seul.
#
# Champs par thème :
#   id                 : identifiant stable (ordre du fichier = ordre du rapport final)
#   titre              : titre de section (## dans le rapport assemblé)
#   format             : forme imposée au LLM (tableau/prose/liste/mixte/lignes)
#   max_lignes         : plafond de lignes du contenu rendu (lignes de tableau comprises, hors
#                        ligne d'en-tête). Facultatif — absent = pas de plafond explicite.
#   source             : "extraction_fields" (aucun appel LLM, reformatage déterministe de
#                        valeurs déjà résolues à l'étape 3) ou "documents" (relecture directe
#                        des documents pivots de ce thème, en map-reduce : un appel LLM par
#                        document pour en tirer un relevé factuel par thème, puis un appel LLM
#                        final par thème qui recoupe ces relevés — app/synthesis/engine.py)
#   extraction_field_ids: pour source=extraction_fields, champs de `extraction_schema.yaml` à
#                        reformater tels quels
#   pivot_categories   : pour source=documents, chemins `taxonomy.yaml` dont les documents
#                        classifiés alimentent ce thème. TOUS sont relus intégralement (l'étape
#                        de map n'a plus de budget de contexte à saturer) ; l'ordre ne détermine
#                        plus que l'ordre d'apparition des relevés dans le prompt final
#   grounding_field_ids: champs déjà résolus à l'étape 3 (extraction_schema.yaml) injectés dans
#                        le prompt comme "données déjà validées" — garantit la cohérence avec
#                        l'étape 3 sans réextraction, et permet de recouper CCTP/notice/RICT
#   cross_document     : true si le thème exige explicitement de croiser plusieurs documents
#                        (ex. RICT vs étude de sol) — purement documentaire ici, le
#                        regroupement multi-catégories est déjà géré par `pivot_categories`
#   instructions       : consigne de rédaction transmise telle quelle au LLM pour ce thème

topics:
  # La carte d'identité du dossier : 100 % déterministe, zéro appel LLM (les valeurs sont déjà
  # résolues et recoupées à l'étape 3). C'est le remplacement le plus direct de prose par tableau —
  # ces données étaient auparavant re-rédigées en paragraphes par plusieurs thèmes à la fois.
  - id: identite_operation
    titre: "Carte d'identité de l'opération"
    format: tableau
    source: extraction_fields
    extraction_field_ids:
      - nom_moa
      - adresse_moa
      - nom_chantier
      - adresse_chantier
      - localisation
      - type_zone
      - destination_batiment
      - travaux_neufs_ou_existant
      - garanties_demandees
      - montants_garanties_demandes
      - montants_totaux_ht
      - montants_totaux_ttc
      - montants_honoraires
      - montants_existants
      - date_debut_travaux
      - date_fin_previsionnelle
      - duree_chantier_mois

  # Feuil2 v2, ligne « Nature et fonction principale de l'ouvrage » : description succincte en
  # 10 lignes + identification de la qualification ERP / ICPE. Remplace, avec les deux thèmes
  # suivants, l'ancien thème fourre-tout `destination_ambition`.
  #
  # TECH/CCTP TRAVAUX conservé (§rapport ANALYSE_ORIGINE_ERREURS.md, dossier Le Grand Pic) : le
  # classement ERP/catégorie est parfois donné différemment par le CCTP (ex. « 2 ERP isolés de
  # 5e catégorie ») et par un rapport SDIS embarqué dans l'arrêté PC (ex. « catégorie 2, type O »).
  # Sans TECH/CCTP TRAVAUX dans le périmètre, ce thème ne voyait jamais qu'une des deux versions et
  # la rapportait comme un fait non contesté. TECH/RICT porte la formulation qui RÉCONCILIE les
  # deux au lieu de les juxtaposer.
  - id: nature_fonction_ouvrage
    titre: "Nature et fonction principale de l'ouvrage"
    format: mixte
    max_lignes: 22
    source: documents
    pivot_categories: ["TECH/NOTICE", "TECH/ARRETE PC", "TECH/RICT", "ASS/CCTP", "ASS/RC", "TECH/CCTP TRAVAUX"]
    grounding_field_ids: [destination_batiment]
    cross_document: true
    instructions: >
      Deux blocs, dans cet ordre, et rien d'autre.

      (1) Un tableau Markdown des qualifications réglementaires, colonnes : "Qualification" |
      "Valeur retenue" | "Source". Une ligne par qualification effectivement documentée parmi :
      classement ERP (type et catégorie), famille d'habitation, IGH, ICPE (rubrique), code du
      travail. Si deux documents donnent des valeurs différentes pour la même qualification, fais
      DEUX lignes, une par source — c'est la divergence qui doit sauter aux yeux, ne tranche pas
      en silence. N'invente aucune ligne : une qualification non documentée n'apparaît pas.

      (2) Une description succincte de l'ouvrage et de sa fonction principale, en 10 lignes
      maximum. Factuelle : ce que le bâtiment est et à quoi il sert. Pas d'introduction, pas de
      conclusion, pas de reprise des données du tableau ci-dessus.

  # Feuil2 v2, ligne « Description de l'opération » : description des travaux en 10 à 15 lignes.
  # Périmètre volontairement restreint aux pièces de synthèse (notice, PC, RC/CCTP assurance) :
  # les CCTP par lot, souvent 15 à 25 documents, produiraient autant de relevés redondants sur ce
  # thème sans rien ajouter à une description d'ensemble.
  - id: description_operation
    titre: "Description de l'opération"
    format: prose
    max_lignes: 15
    source: documents
    pivot_categories: ["TECH/NOTICE", "ASS/RC", "ASS/CCTP", "TECH/ARRETE PC"]
    grounding_field_ids: [travaux_neufs_ou_existant, nombre_batiments_neufs, nombre_batiments_existants]
    instructions: >
      Décris les travaux de l'opération en 10 à 15 lignes maximum, d'un seul tenant. Quelle est la
      consistance des travaux, lot par lot s'ils sont structurants (terrassement, fondations, gros
      œuvre, clos-couvert, second œuvre, VRD, équipements) ? Reste au niveau de l'opération, pas du
      détail d'exécution. Ne répète pas les montants, dates ni surfaces déjà donnés ailleurs dans
      le rapport. Pas d'introduction, pas de conclusion, pas de liste à puces.

  # Feuil2 v2, ligne « Objectifs spécifiques » : qualité attendue, certifications visées (BREEAM,
  # Qualitel, CERQUAL…), en 10 à 15 lignes.
  - id: objectifs_specifiques
    titre: "Objectifs spécifiques et certifications visées"
    format: mixte
    max_lignes: 20
    source: documents
    pivot_categories: ["TECH/NOTICE", "ASS/CCTP", "ASS/RC", "TECH/ARRETE PC"]
    instructions: >
      Deux blocs, dans cet ordre, et rien d'autre.

      (1) Un tableau Markdown des labels, certifications et réglementations visés, colonnes :
      "Label / certification / réglementation" | "Niveau ou millésime visé" | "Source". Une ligne
      par élément effectivement cité (ex. BREEAM, HQE, Qualitel, CERQUAL, E+C-, RE2020, RT2012,
      label biosourcé). Si aucun n'est cité, écris à la place la seule phrase : "Aucune
      certification ou label mentionné dans les documents fournis."

      (2) Les objectifs de qualité attendue non couverts par le tableau (exigences acoustiques,
      thermiques, environnementales, d'accessibilité, ambitions commerciales), en 10 lignes
      maximum. Pas d'introduction, pas de conclusion.

  # TECH/ARRETE PC et TECH/RICT en tête (comparaison avec le rapport de référence validé, dossier
  # Le Grand Pic) : sans eux, ce thème ne voyait le nombre de niveaux que via des plages de niveaux
  # nommées dans le CCTP/la notice (ex. « du niveau -8 au niveau +3 »), que le LLM a confondu avec
  # un compte total (« 8 niveaux » — faux à la fois arithmétiquement, la plage -8..+3 comptant 12
  # niveaux, et par rapport à l'arrêté PC qui donne le compte exact par bâtiment). Le tableau par
  # bâtiment imposé ci-dessous rend cette confusion beaucoup plus visible qu'un paragraphe.
  - id: qualification_operation
    titre: "Qualification de l'opération, volumétrie et contraintes"
    format: tableau
    max_lignes: 30
    source: documents
    pivot_categories: ["TECH/ARRETE PC", "TECH/RICT", "ASS/CCTP", "TECH/NOTICE", "TECH/CCTP TRAVAUX", "ASS/CCAP"]
    grounding_field_ids:
      - travaux_neufs_ou_existant
      - nombre_batiments_neufs
      - nombre_batiments_existants
      - nombre_niveaux_par_batiment
      - hauteur_totale_batiment
      - surfaces_au_sol
      - niveaux_sous_sol
      - profondeur_sous_sol
    cross_document: true
    instructions: >
      Deux tableaux Markdown, dans cet ordre, et rien d'autre — aucune prose autour.

      (1) Volumétrie, une ligne par bâtiment, colonnes : "Bâtiment" | "Neuf / existant" | "Nombre
      de niveaux" | "Niveaux de sous-sol" | "Hauteur" | "Surface" | "Source". Donne le compte exact
      de niveaux tel qu'indiqué explicitement dans les documents (ex. un tableau ou une mention
      "Nombre de niveaux : X") plutôt que de le déduire d'une plage de niveaux nommés : "du niveau
      -8 au niveau +3" désigne 12 niveaux, pas 8 — ne confonds jamais le numéro du niveau le plus
      bas avec un total. Si deux documents donnent des comptes différents pour le même bâtiment,
      fais deux lignes, une par source. Écris "non précisé" dans une cellule sans donnée.

      (2) Contraintes majeures, colonnes : "Contrainte" | "Description" | "Source". Une ligne par
      contrainte réellement documentée (accès exigu, maintien d'activité, phasage, démolition,
      conservation de structures anciennes, topographie, sismicité, contrainte hydrogéologique,
      mitoyenneté). Une ligne = une contrainte, formulée en une phrase. Ne regroupe pas plusieurs
      contraintes dans une même cellule et ne crée pas de ligne pour une contrainte générique non
      citée dans les documents.

  # TECH/DPGF en tête (comparaison avec le rapport de référence validé, dossier Le Grand Pic) :
  # ASS/CCAP, ASS/CCTP et ASS/RC sont des catégories « assurance » qui n'existent que si le dossier
  # embarque le paquet de pièces d'assurance construction — un DCE brut n'en contient aucune, alors
  # que la décomposition du prix global et forfaitaire (DPGF, par lot) y est bien présente. Sans
  # TECH/DPGF, ce thème ne trouvait aucun document pivot pour ce type de dossier.
  #
  # Les montants globaux sont déjà dans la carte d'identité ci-dessus : ce thème ne porte plus que
  # la DÉCOMPOSITION par lot, seule information que l'étape 3 ne sait pas produire. C'est ce qui
  # évitera de re-rédiger en prose un total déjà affiché deux sections plus haut.
  - id: economie_projet
    titre: "Économie du projet — décomposition par lot"
    format: tableau
    max_lignes: 30
    source: documents
    pivot_categories: ["TECH/DPGF", "ASS/CCAP", "ASS/CCTP", "ASS/RC"]
    grounding_field_ids: [montants_totaux_ht, montants_totaux_ttc, montants_honoraires, montants_existants]
    instructions: >
      Un tableau Markdown, colonnes : "Lot / poste" | "Montant" | "Source". Une ligne par lot ou
      poste chiffré trouvé dans les documents, plus une ligne "Total" si un total y figure.
      N'inclus pas les montants déjà validés à l'étape 3 (fournis ci-dessous) sauf s'ils sont
      confirmés ou contredits par un document : dans ce dernier cas, fais une ligne par valeur
      divergente en nommant sa source.

      Si les DPGF fournis sont des trames non chiffrées (montants encore vides), n'invente aucun
      total : remplace entièrement le tableau par la seule phrase "Les DPGF fournies sont des
      trames non chiffrées : aucune décomposition par lot n'est disponible.", suivie au plus de
      deux lignes précisant quels lots sont concernés. Ne liste pas le contenu technique des lots.

  # TECH/NOTICE, TECH/CCTP TRAVAUX et TECH/RICT (comparaison avec le rapport de référence validé,
  # dossier Le Grand Pic) : les noms des acteurs (architecte, BET, bureau de contrôle) figurent
  # presque toujours en page de garde de la notice, du CCTP et du RICT eux-mêmes — pas seulement
  # des pièces d'assurance, qui peuvent être absentes d'un DCE brut.
  - id: equipe_projet
    titre: "Équipe projet (MOE & Études)"
    format: tableau
    max_lignes: 20
    source: documents
    pivot_categories: ["TECH/NOTICE", "TECH/RICT", "ASS/CCAP", "ASS/CCTP", "ASS/RC", "TECH/CCTP TRAVAUX"]
    grounding_field_ids: [equipe_moe]
    instructions: >
      Un tableau Markdown, colonnes : "Rôle" | "Société" | "Source". Une ligne par acteur identifié
      (architecte, BET structure, BET fluides, BET VRD, géotechnicien, bureau de contrôle,
      économiste, OPC, coordonnateur SPS/SSI). N'invente aucun acteur non cité dans les documents.

      Si la dénomination d'un acteur varie entre documents (ex. "L'AGENCE A TROIS" et "L'AGENCE
      A3"), mets les deux dans la cellule "Société" séparées par " / " et nomme les deux sources —
      pas de commentaire en prose sous le tableau. Aucune ligne de texte hors du tableau.

  - id: missions_bureau_controle
    titre: "Missions du bureau de contrôle"
    format: tableau
    max_lignes: 20
    source: documents
    pivot_categories: ["TECH/RICT", "ASS/CCAP"]
    grounding_field_ids: [existence_controle_technique, missions_bureau_controle]
    instructions: >
      Un tableau Markdown, colonnes : "Code" | "Intitulé complet" | "Périmètre". Une ligne par
      mission confiée au bureau de contrôle et citée dans les documents (L, LE, PS, SH, SEI,
      PHhab, TH, HAND, AV, F, P1…). La colonne "Périmètre" ne contient que ce que le document
      précise (bâtiments ou ouvrages concernés) — "non précisé" sinon. Aucune ligne de texte hors
      du tableau.

  - id: synthese_rict
    titre: "Avis du contrôleur technique (RICT)"
    format: mixte
    max_lignes: 40
    source: documents
    pivot_categories: ["TECH/RICT"]
    grounding_field_ids: [existence_rict]
    instructions: >
      Deux blocs, dans cet ordre, et rien d'autre.

      (1) Un tableau Markdown de TOUS les avis suspendus et défavorables, colonnes : "N° d'avis" |
      "Type" | "Lot / ouvrage concerné" | "Point bloquant". "Type" vaut exactement "Suspendu" ou
      "Défavorable". "Point bloquant" tient en une phrase. N'omets aucun avis : ce tableau est
      exhaustif ou il ne sert à rien. Si le RICT ne comporte aucun avis suspendu ni défavorable,
      remplace le tableau par la phrase "Aucun avis suspendu ni défavorable dans le RICT."

      (2) La position générale du bureau de contrôle, en 5 lignes maximum, et uniquement si elle
      apporte quelque chose que le tableau ne dit pas. Développe en un court paragraphe chaque avis
      DÉFAVORABLE (les suspendus restent dans le tableau seul) ; s'il n'y en a aucun, écris la
      seule phrase "Aucun avis défavorable." plutôt que d'omettre la question.

  - id: justifications_techniques
    titre: "Justifications techniques attendues pour lever les avis"
    format: tableau
    max_lignes: 30
    source: documents
    pivot_categories: ["TECH/RICT"]
    instructions: >
      Un tableau Markdown, colonnes : "N° d'avis" | "Justification attendue" | "Pièce à produire".
      Une ligne par avis suspendu ou défavorable identifié dans le RICT, dans le même ordre que le
      thème précédent. "Pièce à produire" doit être concrète et actionnable (plan d'exécution, note
      de calcul, procès-verbal d'essai, certificat, avis technique, mise à jour d'étude
      géotechnique) — jamais une formule générique du type "justificatifs complémentaires". Si le
      RICT ne précise pas la pièce attendue pour un avis, écris "non précisée par le RICT". Aucune
      ligne de texte hors du tableau.

  - id: environnement_voisinage
    titre: "Environnement et voisinage (mission AV)"
    format: mixte
    max_lignes: 25
    source: documents
    pivot_categories: ["TECH/RICT", "TECH/ETUDE DE SOL", "TECH/SOCABAT", "TECH/CCTP TRAVAUX"]
    grounding_field_ids: [distance_avoisinants, refere_preventif, mission_av, emprise_sous_sol]
    cross_document: true
    instructions: >
      Deux blocs, dans cet ordre, et rien d'autre.

      (1) Un tableau Markdown des avoisinants, colonnes : "Avoisinant" | "Distance" | "Structure /
      âge / usage" | "Source". Une ligne par avoisinant mentionné, "non précisé" dans les cellules
      sans donnée. Si aucun avoisinant n'est mentionné, remplace le tableau par la phrase "Aucun
      avoisinant mentionné dans les documents fournis."

      (2) Le niveau de risque lié aux avoisinants, en 10 lignes maximum : conclusions du RICT sur
      la mission AV, besoin de reprises en sous-œuvre, parois berlinoises ou moulées, référé
      préventif. Si une autre source (étude de sol, CCTP, étude Socabat) traite des avoisinants et
      diverge du RICT, signale la divergence en nommant les deux fichiers.

  - id: diagnostic_existant
    titre: "Diagnostic de l'existant (focus structure)"
    format: prose
    max_lignes: 25
    source: documents
    pivot_categories: ["TECH/NOTICE", "ASS/CCTP", "TECH/CCTP TRAVAUX"]
    grounding_field_ids: [travaux_neufs_ou_existant, nombre_batiments_existants]
    instructions: >
      S'il s'agit d'une rénovation ou d'une restructuration (bâtiment(s) existant(s) mentionnés
      dans les données déjà validées ou les documents fournis), fais une synthèse de l'état des
      lieux : pathologies identifiées, limites de capacité portante, renforts prévus. C'est l'un
      des rares thèmes où la prose est justifiée — l'enchaînement pathologie → conséquence
      structurelle → renfort prévu perd son sens en tableau. Reste néanmoins factuel : pas
      d'introduction, pas de conclusion, pas de récapitulatif.

      Si l'opération est une construction neuve sans existant, réponds exactement "Sans objet —
      opération de construction neuve, aucun bâtiment existant à diagnostiquer." et rien d'autre,
      sans inventer de diagnostic.

  - id: recit_sol
    titre: "Le récit du sol (géotechnique)"
    format: tableau
    max_lignes: 25
    source: documents
    pivot_categories: ["TECH/ETUDE DE SOL"]
    grounding_field_ids: [etude_de_sol, stratigraphie, pollution_sols]
    instructions: >
      Un tableau Markdown, colonnes : "Couche" | "Profondeur" | "Description" | "Caractéristiques
      mécaniques (cohésion, angle de frottement, compacité)". Une ligne par couche identifiée dans
      l'étude de sol, de la plus superficielle à la plus profonde. Ne donne pas seulement les
      sigles des missions géotechniques.

      Sous le tableau, au plus 3 lignes : le mode de fondation retenu et, si les sols sont pollués,
      le niveau de pollution et le traitement prévu. Rien d'autre.

  - id: niveaux_hautes_eaux
    titre: "Niveaux des plus hautes eaux"
    format: mixte
    max_lignes: 12
    source: documents
    pivot_categories: ["TECH/ETUDE DE SOL"]
    grounding_field_ids: [niveau_hautes_eaux, parties_enterrees]
    instructions: >
      Un tableau Markdown, colonnes : "Niveau" | "Cote / valeur" | "Source". Une ligne pour
      chacun des niveaux Eaux Basses (EB), Eaux Exceptionnelles (EE) et Hautes Eaux (EH/PHEC), plus
      toute autre cote piézométrique relevée. Écris "non défini" dans la colonne "Cote / valeur"
      quand l'étude ne le précise pas — les trois lignes EB/EE/EH doivent apparaître même non
      renseignées.

      Sous le tableau, au plus 4 lignes sur l'incidence de ces niveaux sur la conception
      (cuvelage, drainage renforcé, dispositions sur les parties enterrées). Rien d'autre.

  - id: agressivite_chimique
    titre: "Agressivité chimique et durabilité"
    format: mixte
    max_lignes: 15
    source: documents
    pivot_categories: ["TECH/ETUDE DE SOL"]
    instructions: >
      Un tableau Markdown, colonnes : "Paramètre" | "Valeur mesurée" | "Classe d'exposition" |
      "Source". Une ligne par paramètre effectivement mesuré dans l'étude (sulfates, chlorures, pH,
      CO2 agressif, magnésium, ammonium, résistivité). Si l'étude ne donne aucune analyse chimique,
      remplace le tableau par la phrase "Aucune analyse chimique des eaux souterraines ou du sol
      dans l'étude de sol fournie."

      Sous le tableau, au plus 4 lignes sur les conséquences pour le choix des ciments et la
      protection des armatures (classe d'exposition retenue, enrobage, épaisseur sacrificielle).
      Rien d'autre.
