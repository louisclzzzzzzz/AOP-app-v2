# Modèles Mistral utilisés par AOP v2 — versions épinglées.
# Toute évolution de version se fait ici, jamais en dur dans le code.
# Convention: on épingle une version datée en prod pour la reproductibilité;
# "-latest" reste utilisable en dev pour suivre les dernières améliorations Mistral.

ocr:
  model: "mistral-ocr-2512"
  fallback_latest: "mistral-ocr-latest"
  # Seuil de confiance moyenne par bloc en-dessous duquel un document est marqué "à vérifier"
  min_confidence: 0.70
  # Concurrence max sur la file OCR (upload + /v1/ocr) — indépendante de la file LLM chat,
  # cadencée séparément (§1/§4 OPTIMISATION.md). Valeur prudente par défaut, ajustable.
  max_concurrency: 3
  # Timeout par appel (upload et /v1/ocr) — sans ça, un appel qui reste bloqué fige tout le
  # lot en cours (asyncio.gather), donc toute la progression du dossier (AUDIT_BACKEND.md §2).
  timeout_seconds: 180

llm:
  # Classification (étape 1), complétude (étape 2), extraction (étape 3)
  model: "mistral-large-2512"
  fallback_latest: "mistral-large-latest"
  # Documents à forte composante image (plans, schémas) : modèle multimodal (Pixtral a été
  # retiré du catalogue Mistral ; mistral-medium est nativement multimodal depuis 2505)
  multimodal_model: "mistral-medium-2604"
  # Température basse partout : on veut de la reproductibilité, pas de créativité
  # Température basse partout : reproductibilité. Sur re-tentative après une réponse JSON
  # structurée invalide (guillemet interne non échappé…), on relève légèrement la température
  # (§parse_retries) pour casser une sortie déterministe malformée.
  temperature: 0.0
  max_retries: 3
  # Plafond de tokens de sortie : les sections d'audit (Phase 2) et thèmes de synthèse (Phase 1)
  # produisent de longs rapports structurés — sans plafond explicite, une réponse tronquée par le
  # défaut du modèle donne un JSON invalide (JSONDecodeError). Généreux pour laisser passer une
  # section entière de risques développés.
  max_tokens: 8000
  # Plafond spécifique aux étapes « map » des deux phases d'analyse (un relevé factuel par document
  # pivot, couvrant d'un coup tous les thèmes/sections dont il est pivot). Ces appels produisent
  # bien plus de sortie qu'un thème ou une section : le RICT du dossier de test rend ~117 constats
  # répartis sur 6 sections, ce qui dépasse les 8000 tokens ci-dessus. La réponse était alors
  # tronquée en plein JSON, et le rattrapage renvoyait un relevé beaucoup plus pauvre (6 constats
  # au lieu de 117) sans que rien ne le signale comme une perte.
  max_tokens_document_summary: 16000
  # Nombre de re-tentatives quand la réponse structurée n'est pas un JSON parsable (distinct de
  # max_retries qui couvre les erreurs réseau/API). Chaque re-tentative relève la température.
  parse_retries: 2
  # Relevé de 120s : la synthèse projet (app/synthesis/engine.py) envoie désormais jusqu'à ~100k
  # tokens de contexte par appel (§SYNTHESIS_TOTAL_CONTEXT_MAX_CHARS), un volume qui peut dépasser
  # 120s de traitement — les autres usages (classification/complétude/extraction) restent sur des
  # contextes bien plus courts, donc une limite plus haute ne fait qu'élargir la marge de sécurité.
  timeout_seconds: 300
  # Espacement minimum entre deux appels chat structurés (file LLM mono-worker, §4
  # OPTIMISATION.md) — valeur prudente par défaut, à ajuster selon le palier de rate limit réel.
  min_interval_seconds: 1.0

extraction:
  # Nombre de passes de recoupement pour les champs critiques (montants, dates, garanties)
  cross_check_passes: 2
  # Champs pour lesquels le recoupement multi-documents (RC/CCAP/CCTP) est obligatoire
  cross_check_required_fields:
    - montants_totaux_ht
    - montants_totaux_ttc
    - garanties_demandees
    - date_debut_travaux
    - date_fin_previsionnelle

embeddings:
  # Recherche sémantique de la COUCHE 2 de l'extraction (étape 3) : sélection des documents
  # candidats quand un champ reste absent après la couche 1. Le scoring par mots-clés seul est
  # aveugle dès que le document formule l'information autrement que ne l'anticipent les `indices`
  # du schéma (synonyme, tournure, terme technique non prévu) — c'est le seul point du run
  # automatique où ce risque n'est pas couvert par une validation humaine, contrairement à la
  # couche 1 qui s'appuie sur une classification déjà validée par l'expert.
  model: "mistral-embed-2312"
  fallback_latest: "mistral-embed"
  # Passer à false pour revenir au comportement historique (mots-clés seuls). Le pipeline y
  # retombe de lui-même, sans échouer, si l'API embeddings est indisponible.
  enabled: true
  # Taille de découpe des documents avant vectorisation. Un document entier vectorisé d'un bloc
  # dilue le passage pertinent dans le reste du texte : un CCTP de 200 pages ressemble d'abord à
  # un CCTP, quelle que soit la donnée cherchée. ~3000 caractères ≈ 1000 tokens, l'ordre de
  # grandeur usuel pour de la recherche de passage.
  chunk_max_chars: 3000
  # Un appel /v1/embeddings couvre plusieurs morceaux à la fois. mistral-embed est limité à
  # 1 requête/s mais 20 M tokens/min (§modeles_mistral_limites.md) : le facteur limitant est le
  # NOMBRE d'appels, jamais le volume — d'où des lots volontairement gros.
  batch_max_chars: 200000
  batch_max_inputs: 128
  # Similarité cosinus minimale pour qu'un document soit proposé au LLM. 0 = aucun plancher, et
  # c'est volontaire : ce qui porte le signal est le CLASSEMENT, pas la valeur absolue. Mesuré sur
  # l'API réelle (mistral-embed-2312, requête du champ `stratigraphie`) : 0.86 pour un passage qui
  # emploie le mot exact, 0.79 pour le même contenu reformulé sans aucun mot-clé du champ — celui
  # que la sélection par mots-clés rate — et 0.71 pour un passage franchement hors sujet (délais,
  # montants). L'écart utile tient donc dans ~0.15 : un plancher mal calibré écarterait la
  # reformulation, c'est-à-dire précisément l'angle mort qu'on corrige ici. La sélection reste
  # de toute façon bornée par `MAX_LLM_CANDIDATES`. Les scores réels sont journalisés (INFO) pour
  # permettre de calibrer ce plancher sur de vrais dossiers avant de le relever.
  min_similarity: 0.0

completeness:
  # Seuil de confiance OCR en-dessous duquel une correspondance passe en "à vérifier"
  min_ocr_confidence_for_certain: 0.80
  # Seuil de confiance LLM en-dessous duquel une correspondance passe en "à vérifier"
  min_llm_confidence_for_certain: 0.75

classification:
  min_confidence_for_auto_apply: 0.60
  # Modèle dédié à la classification batchée (§2 OPTIMISATION.md) : tâche facile, un modèle
  # moins cher suffit et n'entame pas le quota du modèle d'extraction (mistral-large).
  model: "mistral-small-2603"
  fallback_latest: "mistral-small-latest"
  # Nombre de documents ambigus regroupés dans un même appel LLM structuré.
  batch_size: 10

text_extraction:
  # Densité de texte natif (caractères / page) en-dessous de laquelle on déclenche l'OCR de contrôle
  native_text_density_threshold: 200
  # Si la densité moyenne sur tout le document est en-dessous de ce seuil, on considère
  # le PDF comme scanné/plan et on OCRise systématiquement toutes les pages.
  scanned_pdf_density_threshold: 50
  # Expérimental (phase 4 OPTIMISATION.md) : aucun OCR pendant l'ingestion (étapes 1/2), texte
  # natif seul. L'OCR n'a lieu qu'à la demande en étape 3, pour les seuls documents concernés par
  # l'extraction (`ensure_document_ocr`). Repasser à false pour retrouver le comportement validé
  # (OCR upfront sur tout document analysable, resultats_tests_1/).
  defer_ocr_to_extraction: true

feature_flags:
  # Pré-calcul du niveau RCMO/TRC via le tableau Feuil1 de donnees_de_ref.md (§6.3, §12)
  precompute_rcmo_trc: false
