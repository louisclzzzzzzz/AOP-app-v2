name: CI

# Sur chaque push et pull request : fait tourner la suite de tests backend et le build/lint
# frontend automatiquement (jusqu'ici, seul `build-windows-exe.yml` existait, déclenché
# manuellement ou sur tag — la suite pytest ne tournait donc jamais sur push/PR, seulement à la
# main). Sépare des workflows de build/release ci-dessus : ceux-là restent gros et lents
# (PyInstaller), celui-ci doit rester rapide pour donner un retour à chaque commit.
on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Python
        run: uv python install 3.12

      - name: Sync backend dependencies
        run: uv sync --frozen

      - name: Run backend tests
        run: uv run --frozen pytest -v
        # Aucune clé API réelle nécessaire : les appels Mistral sont simulés (monkeypatch),
        # cf. README.md §Tests.

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (inclut la vérification de types tsc)
        run: npm run build
